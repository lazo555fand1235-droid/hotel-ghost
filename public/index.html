<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hotel Ghost 👻</title>
<script src="/socket.io/socket.io.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0a0a14;--bg2:#11111f;--bg3:#18182a;--bg4:#20203a;
  --accent:#8b7cf6;--accent2:#b8aeff;--green:#4ecb71;--red:#e05252;
  --yellow:#f0c040;--blue:#4eb8cb;--text:#ddd;--muted:#666;
  --border:#2a2a44;--radius:10px;
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',Tahoma,sans-serif;min-height:100vh;}
.screen{display:none;}
.screen.active{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:16px;}

/* ---- LOBBY ---- */
#lobby-screen{background:radial-gradient(ellipse at 50% 0%,#1a1040 0%,var(--bg) 70%);}
.lobby-wrap{background:var(--bg3);border:1px solid var(--border);border-radius:16px;padding:36px;width:100%;max-width:400px;}
.game-logo{text-align:center;margin-bottom:24px;}
.game-logo h1{font-size:2.4rem;font-weight:900;letter-spacing:-1px;}
.game-logo h1 span{color:var(--accent2);}
.game-logo p{color:var(--muted);font-size:.85rem;margin-top:4px;}
.inp-group{margin-bottom:14px;}
.inp-group label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:1px;}
.inp-group input{width:100%;padding:11px 14px;background:var(--bg4);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:.95rem;outline:none;transition:border-color .2s;}
.inp-group input:focus{border-color:var(--accent);}
.btn{width:100%;padding:12px;border:none;border-radius:8px;font-size:.95rem;font-weight:700;cursor:pointer;transition:all .2s;margin-top:6px;}
.btn-main{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;}
.btn-main:hover{opacity:.88;transform:translateY(-1px);}
.btn-ghost{background:var(--bg4);color:var(--muted);border:1px solid var(--border);}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);}
.btn-danger{background:var(--red);color:#fff;}
.btn:disabled{opacity:.35;pointer-events:none;}

/* ---- WAITING ---- */
#waiting-screen{background:var(--bg);}
.wait-box{background:var(--bg3);border:1px solid var(--border);border-radius:16px;padding:28px;width:100%;max-width:460px;}
.room-badge{background:var(--bg4);border-radius:10px;padding:14px;text-align:center;margin-bottom:18px;}
.room-badge .lbl{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:2px;}
.room-badge .rid{font-size:2.2rem;font-weight:900;color:var(--accent2);letter-spacing:5px;}
.copy-btn{background:none;border:1px solid var(--accent);color:var(--accent);border-radius:5px;padding:3px 10px;cursor:pointer;font-size:.75rem;margin-top:6px;}
.player-grid{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0;}
.pchip{display:flex;align-items:center;gap:7px;background:var(--bg4);border-radius:8px;padding:7px 12px;font-size:.88rem;}
.pchip .ava{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;}
.host-tag{background:var(--yellow);color:#000;border-radius:4px;padding:1px 6px;font-size:.68rem;font-weight:800;}
.ai-tag{background:#333;color:var(--muted);border-radius:4px;padding:1px 6px;font-size:.68rem;}

/* ---- GAME ---- */
#game-screen{background:var(--bg);align-items:flex-start;padding:12px;}
.game-wrap{width:100%;max-width:980px;}

/* header bar */
.hbar{display:flex;align-items:center;justify-content:space-between;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:12px 18px;margin-bottom:10px;flex-wrap:wrap;gap:8px;}
.hbar-left{display:flex;align-items:center;gap:16px;}
.stars-row{display:flex;gap:3px;font-size:1.2rem;}
.round-badge{background:var(--bg4);border-radius:6px;padding:4px 10px;font-size:.82rem;color:var(--muted);}
.timer-big{font-size:1.6rem;font-weight:900;color:var(--green);min-width:48px;text-align:right;}
.timer-big.warn{color:var(--red);animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}

/* grid */
.game-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;}
.panel{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:14px;}
.panel-title{font-size:.72rem;text-transform:uppercase;letter-spacing:2px;color:var(--muted);margin-bottom:10px;display:flex;align-items:center;gap:6px;}
.panel-title span{background:var(--bg4);border-radius:4px;padding:1px 6px;font-size:.75rem;color:var(--accent2);}

/* guest queue */
.guest-card{background:var(--bg4);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px;transition:border-color .2s;}
.guest-card.voting{border-color:var(--yellow);}
.gc-head{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;}
.gc-name{font-weight:700;font-size:.95rem;}
.gc-card{font-size:.72rem;border-radius:4px;padding:2px 7px;font-weight:700;}
.card-ok{background:rgba(78,203,113,.15);color:var(--green);}
.card-hole{background:rgba(240,192,64,.15);color:var(--yellow);}
.card-none{background:rgba(224,82,82,.15);color:var(--red);}
.gc-stats{display:flex;gap:10px;font-size:.78rem;color:var(--muted);margin-bottom:7px;flex-wrap:wrap;}
.gc-clues{margin-bottom:8px;}
.clue-item{font-size:.75rem;color:#aaa;padding:2px 0;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:5px;}
.clue-item::before{content:'•';color:var(--accent);flex-shrink:0;}
.gc-actions{display:flex;gap:6px;flex-wrap:wrap;}
.vote-row{display:flex;align-items:center;gap:8px;margin-top:6px;}
.vote-counts{font-size:.78rem;color:var(--muted);}
.vote-bar-wrap{flex:1;height:6px;background:var(--bg);border-radius:3px;overflow:hidden;}
.vote-bar-fill{height:100%;background:var(--accent);border-radius:3px;transition:width .3s;}
.btn-sm{padding:5px 10px;border:none;border-radius:6px;font-size:.78rem;font-weight:700;cursor:pointer;transition:all .15s;}
.btn-accept{background:rgba(78,203,113,.2);color:var(--green);border:1px solid rgba(78,203,113,.3);}
.btn-accept:hover{background:rgba(78,203,113,.35);}
.btn-reject{background:rgba(224,82,82,.2);color:var(--red);border:1px solid rgba(224,82,82,.3);}
.btn-reject:hover{background:rgba(224,82,82,.35);}
.btn-scan{background:rgba(139,124,246,.2);color:var(--accent2);border:1px solid rgba(139,124,246,.3);}
.btn-scan:hover{background:rgba(139,124,246,.35);}
.checkedin-tag{font-size:.72rem;color:var(--muted);font-style:italic;}

/* hotel rooms */
.rooms-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;}
.room-cell{background:var(--bg4);border:1px solid var(--border);border-radius:7px;padding:8px 7px;text-align:center;cursor:pointer;transition:all .2s;position:relative;}
.room-cell:hover{border-color:var(--accent);}
.room-cell.occupied{border-color:var(--blue);}
.room-cell.my-room{border-color:var(--accent2);box-shadow:0 0 0 2px rgba(184,174,255,.2);}
.room-cell .rnum{font-size:.8rem;font-weight:700;color:var(--accent2);}
.room-cell .rguest{font-size:.65rem;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.room-cell .ricon{font-size:1rem;margin-bottom:2px;}
.clue-dot{position:absolute;top:4px;right:4px;width:7px;height:7px;background:var(--yellow);border-radius:50%;}

/* tasks */
.task-card{background:var(--bg4);border:1px solid var(--border);border-radius:8px;padding:10px 12px;margin-bottom:8px;}
.task-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.task-name{font-weight:700;font-size:.9rem;}
.task-done{color:var(--green);font-size:.78rem;}
.task-desc{font-size:.78rem;color:var(--muted);margin-bottom:7px;}
.task-prog{font-size:.75rem;color:var(--blue);margin-bottom:6px;}
.progress-bar{height:5px;background:var(--bg);border-radius:3px;overflow:hidden;margin-bottom:7px;}
.progress-fill{height:100%;background:var(--blue);border-radius:3px;transition:width .3s;}

/* clues panel */
.clue-log{max-height:160px;overflow-y:auto;font-size:.78rem;}
.clue-log::-webkit-scrollbar{width:3px;}
.clue-log::-webkit-scrollbar-thumb{background:var(--border);}
.clue-entry{padding:4px 0;border-bottom:1px solid var(--border);color:#aaa;display:flex;gap:6px;}
.clue-entry .ce-src{color:var(--yellow);font-size:.7rem;flex-shrink:0;}

/* event log */
.log-wrap{grid-column:1/-1;}
.elog{max-height:120px;overflow-y:auto;font-size:.78rem;}
.elog::-webkit-scrollbar{width:3px;}
.elog::-webkit-scrollbar-thumb{background:var(--border);}
.log-line{padding:3px 0;border-bottom:1px solid var(--bg4);color:var(--muted);}
.log-line.good{color:var(--green);}
.log-line.bad{color:var(--red);}
.log-line.info{color:var(--accent2);}
.log-line.warn{color:var(--yellow);}

/* vote end game */
.vote-end-row{grid-column:1/-1;background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;display:flex;align-items:center;gap:14px;}
.ve-bar-wrap{flex:1;height:8px;background:var(--bg4);border-radius:4px;overflow:hidden;}
.ve-bar-fill{height:100%;background:var(--accent);border-radius:4px;transition:width .3s;}

/* role badge in header */
.role-badge{border-radius:6px;padding:4px 10px;font-size:.8rem;font-weight:700;}
.role-ghost{background:rgba(139,124,246,.2);color:var(--accent2);}
.role-human{background:rgba(78,203,113,.2);color:var(--green);}

/* ---- ROLE REVEAL ---- */
#role-screen{background:var(--bg);}
.role-box{background:var(--bg3);border:1px solid var(--border);border-radius:16px;padding:32px;max-width:380px;width:100%;text-align:center;}
.role-card-inner{border-radius:12px;padding:28px 24px;margin:18px 0;}
.rci-ghost{background:rgba(139,124,246,.08);border:2px solid var(--accent);}
.rci-human{background:rgba(78,203,113,.08);border:2px solid var(--green);}
.role-icon{font-size:4rem;margin-bottom:8px;}
.role-title{font-size:1.5rem;font-weight:900;margin-bottom:6px;}
.role-desc{font-size:.85rem;color:var(--muted);}
#role-cd{color:var(--muted);font-size:.85rem;margin-top:14px;}

/* ---- END ---- */
#end-screen{background:var(--bg);}
.end-box{background:var(--bg3);border-radius:16px;padding:32px;max-width:440px;width:100%;text-align:center;}
.end-win{border:2px solid var(--green);}
.end-lose{border:2px solid var(--red);}
#end-icon{font-size:4rem;}
#end-title{font-size:2rem;font-weight:900;margin:10px 0;}
#end-desc{color:var(--muted);margin-bottom:18px;font-size:.9rem;}
.reveal-list{margin-bottom:16px;width:100%;}
.rev-item{display:flex;align-items:center;gap:10px;background:var(--bg4);border-radius:7px;padding:9px 12px;margin-bottom:6px;text-align:left;font-size:.88rem;}
.rev-room{border-radius:7px;padding:9px 12px;margin-bottom:6px;background:var(--bg4);display:flex;align-items:center;gap:10px;font-size:.82rem;}
.rev-ghost{color:var(--accent2);}
.rev-human{color:var(--green);}
.final-stars{font-size:1.4rem;margin-bottom:8px;}

/* ---- TOAST ---- */
#toast-container{position:fixed;bottom:18px;right:18px;display:flex;flex-direction:column;gap:7px;z-index:9999;}
.toast{background:var(--bg3);border-left:4px solid var(--accent);border-radius:8px;padding:10px 14px;font-size:.85rem;box-shadow:0 4px 14px rgba(0,0,0,.5);animation:tin .3s ease;max-width:280px;}
.toast.good{border-color:var(--green);}
.toast.bad{border-color:var(--red);}
.toast.warn{border-color:var(--yellow);}
.toast.info{border-color:var(--blue);}
@keyframes tin{from{transform:translateX(110%);opacity:0;}to{transform:translateX(0);opacity:1;}}

/* MY ROLE DISPLAY */
#my-role-chip{font-size:.82rem;}

/* responsive */
@media(max-width:700px){
  .game-grid{grid-template-columns:1fr;}
  .rooms-grid{grid-template-columns:repeat(4,1fr);}
  .hbar{flex-direction:column;align-items:flex-start;}
}
</style>
</head>
<body>

<!-- ===== LOBBY ===== -->
<div id="lobby-screen" class="screen active">
  <div class="lobby-wrap">
    <div class="game-logo">
      <h1>Hotel <span>Ghost</span> 👻</h1>
      <p>คัดกรองผีออกจากโรงแรม — ก่อนที่จะสายเกินไป</p>
    </div>
    <div class="inp-group"><label>ชื่อผู้เล่น</label><input id="inp-name" placeholder="กรอกชื่อ..." maxlength="16"></div>
    <div class="inp-group"><label>รหัสห้อง</label><input id="inp-room" placeholder="ใส่รหัส หรือปล่อยว่างเพื่อสร้างใหม่" maxlength="8"></div>
    <button class="btn btn-main" onclick="joinRoom()">เข้าห้อง / สร้างห้อง</button>
  </div>
</div>

<!-- ===== WAITING ===== -->
<div id="waiting-screen" class="screen">
  <div class="wait-box">
    <div class="room-badge">
      <div class="lbl">รหัสห้อง</div>
      <div class="rid" id="w-roomid">----</div>
      <button class="copy-btn" onclick="copyRoom()">คัดลอก</button>
    </div>
    <div id="w-player-list" class="player-grid"></div>
    <div id="w-count" style="color:var(--muted);font-size:.82rem;margin-bottom:14px;"></div>
    <button class="btn btn-main" id="btn-start" onclick="startGame()" disabled>เริ่มเกม</button>
    <button class="btn btn-ghost" id="btn-wait" style="display:none">รอ host เริ่ม...</button>
  </div>
</div>

<!-- ===== ROLE REVEAL ===== -->
<div id="role-screen" class="screen">
  <div class="role-box">
    <h2 style="margin-bottom:4px;">บทบาทของคุณ</h2>
    <p style="color:var(--muted);font-size:.85rem;margin-bottom:4px;">จำไว้ให้ดี — ห้ามบอกคนอื่น</p>
    <div id="role-card-inner"></div>
    <div id="role-cd"></div>
  </div>
</div>

<!-- ===== GAME ===== -->
<div id="game-screen" class="screen">
  <div class="game-wrap">

    <!-- header -->
    <div class="hbar">
      <div class="hbar-left">
        <div>
          <div style="font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin-bottom:3px;">คะแนนดาว</div>
          <div class="stars-row" id="stars-row">⭐⭐⭐⭐⭐</div>
        </div>
        <div class="round-badge">รอบ <span id="round-num">1</span></div>
        <div id="my-role-chip"></div>
      </div>
      <div>
        <div style="font-size:.68rem;color:var(--muted);text-align:right;">เวลารอบนี้</div>
        <div class="timer-big" id="timer-display">20</div>
      </div>
    </div>

    <!-- main grid -->
    <div class="game-grid">

      <!-- col 1: guest queue -->
      <div class="panel">
        <div class="panel-title">🧍 แถวรอแขก <span id="queue-count">0</span></div>
        <div id="guest-list"></div>
      </div>

      <!-- col 2: hotel rooms + tasks -->
      <div style="display:flex;flex-direction:column;gap:10px;">
        <div class="panel">
          <div class="panel-title">🏨 ห้องพัก</div>
          <div class="rooms-grid" id="rooms-grid"></div>
        </div>
        <div class="panel">
          <div class="panel-title">📋 ภารกิจ</div>
          <div id="tasks-list"></div>
        </div>
      </div>

      <!-- col 3: clues + players -->
      <div style="display:flex;flex-direction:column;gap:10px;">
        <div class="panel">
          <div class="panel-title">🔍 เบาะแส</div>
          <div class="clue-log" id="clue-log"></div>
          <div id="clue-empty" style="color:var(--muted);font-size:.78rem;text-align:center;padding:8px 0;">ยังไม่มีเบาะแส</div>
        </div>
        <div class="panel">
          <div class="panel-title">👥 ผู้เล่น</div>
          <div id="player-list-game"></div>
        </div>
      </div>

      <!-- vote end (full width) -->
      <div class="vote-end-row">
        <div style="font-size:.85rem;">โหวตจบเกม<br><span style="font-size:.72rem;color:var(--muted);">ต้องไม่มีผีอยู่ในโรงแรม</span></div>
        <div class="ve-bar-wrap"><div class="ve-bar-fill" id="ve-fill" style="width:0%"></div></div>
        <div id="ve-text" style="font-size:.82rem;color:var(--muted);min-width:40px;text-align:center;">0/1</div>
        <button class="btn-sm btn-scan" onclick="voteEnd()" id="btn-vote-end">โหวต</button>
      </div>

      <!-- log (full width) -->
      <div class="panel log-wrap">
        <div class="panel-title">📜 บันทึกเหตุการณ์</div>
        <div class="elog" id="elog"></div>
      </div>

    </div>
  </div>
</div>

<!-- ===== END ===== -->
<div id="end-screen" class="screen">
  <div class="end-box" id="end-box">
    <div id="end-icon">🎉</div>
    <div id="end-title">ชนะแล้ว!</div>
    <div class="final-stars" id="final-stars"></div>
    <div id="end-desc"></div>
    <div class="reveal-list" id="reveal-rooms"></div>
    <div class="reveal-list" id="reveal-players"></div>
    <div class="reveal-list" id="reveal-guests"></div>
    <button class="btn btn-main" onclick="location.reload()">เล่นใหม่</button>
  </div>
</div>

<!-- Toast container -->
<div id="toast-container"></div>

<script>
const socket = io();
let myRoomId = '';
let myRole = 'human';
let myName = '';
let isHost = false;

// state
let guestMap = {};
let playerMap = {};
let clues = [];
let tasks = [];
let currentRoom = 'lobby';
let votedEnd = false;

const COLORS = ['#8b7cf6','#4ecb71','#e05252','#f0c040','#4eb8cb','#e09450'];
function avatarColor(name){ let h=0;for(let c of name)h=(h+c.charCodeAt(0))%COLORS.length;return COLORS[h]; }
function initials(name){ return name.slice(0,2).toUpperCase(); }
function show(id){ document.querySelectorAll('.screen').forEach(s=>{s.classList.remove('active');s.style.display='none';}); const el=document.getElementById(id);el.style.display='flex';el.classList.add('active'); }

function toast(msg,type='',dur=3200){
  const t=document.createElement('div');
  t.className='toast '+(type||'');
  t.textContent=msg;
  const c=document.getElementById('toast-container');
  c.appendChild(t);
  setTimeout(()=>t.remove(),dur);
}
function addLog(text,type=''){
  const el=document.getElementById('elog');
  if(!el)return;
  const d=document.createElement('div');
  d.className='log-line '+(type||'');
  d.textContent=text;
  el.appendChild(d);
  el.scrollTop=el.scrollHeight;
}

// ---- JOIN ----
function joinRoom(){
  const name=document.getElementById('inp-name').value.trim();
  const room=document.getElementById('inp-room').value.trim().toUpperCase()||
    Math.random().toString(36).slice(2,6).toUpperCase();
  if(!name){toast('ใส่ชื่อก่อนนะ','bad');return;}
  myName=name;
  myRoomId=room;
  socket.emit('join_room',{roomId:room,playerName:name});
}
function copyRoom(){
  navigator.clipboard.writeText(myRoomId).then(()=>toast('คัดลอกรหัสห้องแล้ว','info'));
}
function startGame(){ socket.emit('start_game'); }

socket.on('lobby_update',({players,count})=>{
  show('waiting-screen');
  document.getElementById('w-roomid').textContent=myRoomId;
  const grid=document.getElementById('w-player-list');
  grid.innerHTML='';
  players.forEach(p=>{
    const d=document.createElement('div');d.className='pchip';
    d.innerHTML=`<div class="ava" style="background:${avatarColor(p.name)}">${initials(p.name)}</div>
      <span>${p.name}</span>
      ${p.isHost?'<span class="host-tag">HOST</span>':''}
      ${p.isAI?'<span class="ai-tag">AI</span>':''}`;
    grid.appendChild(d);
  });
  document.getElementById('w-count').textContent=`${count} คน`;
  const meHost=players.find(p=>p.name===myName&&p.isHost);
  isHost=!!meHost;
  document.getElementById('btn-start').style.display=isHost?'':'none';
  document.getElementById('btn-wait').style.display=isHost?'none':'';
  document.getElementById('btn-start').disabled=count<1;
});

// ---- ROLE ----
socket.on('your_role',({role})=>{
  myRole=role;
  show('role-screen');
  const isGhost=role==='ghost';
  document.getElementById('role-card-inner').innerHTML=`
    <div class="role-card-inner ${isGhost?'rci-ghost':'rci-human'}">
      <div class="role-icon">${isGhost?'👻':'👤'}</div>
      <div class="role-title" style="color:${isGhost?'var(--accent2)':'var(--green)'}">${isGhost?'คุณคือผี':'คุณคือมนุษย์'}</div>
      <div class="role-desc">${isGhost?'ซ่อนตัว อย่าให้โดนโหวตไล่ออก แทรกซึมเป็นพนักงาน':'คัดกรองแขกและพนักงานที่เป็นผีให้หมด'}</div>
    </div>`;
  let cd=4;
  const cdEl=document.getElementById('role-cd');
  const iv=setInterval(()=>{
    cdEl.textContent=`เข้าโรงแรมใน ${cd} วิ...`;
    cd--;
    if(cd<0){clearInterval(iv);}
  },1000);
});

// ---- ROUND START ----
socket.on('round_start',({round,tasks:t,guestCount})=>{
  show('game-screen');
  document.getElementById('round-num').textContent=round;
  toast(`🔔 รอบ ${round} เริ่มต้น — แขก ${guestCount} คนรอเช็คอิน`,'info');
  addLog(`--- รอบ ${round} เริ่มต้น ---`,'info');
  const chip=document.getElementById('my-role-chip');
  chip.innerHTML=myRole==='ghost'
    ?'<span class="role-badge role-ghost">👻 ผี</span>'
    :'<span class="role-badge role-human">👤 มนุษย์</span>';
});

socket.on('round_timer',({roundTime})=>{
  const el=document.getElementById('timer-display');
  el.textContent=roundTime;
  el.className='timer-big'+(roundTime<=7?' warn':'');
});

socket.on('round_end',({round,ghostsIn,starsLost,stars})=>{
  if(ghostsIn>0){
    toast(`⚠️ รอบ ${round} จบ — ผีอยู่ในโรงแรม ${ghostsIn} ตัว! เสีย ${starsLost} ดาว`,'bad',4000);
    addLog(`รอบ ${round} จบ — ผีซ่อนอยู่ ${ghostsIn} ตัว เสีย ${starsLost} ดาว`,'bad');
  } else {
    toast(`✅ รอบ ${round} จบ — ไม่มีผีหลุดรอด!`,'good',3000);
    addLog(`รอบ ${round} จบ — ปลอดภัย`,'good');
  }
  updateStars(stars);
});

// ---- STATE UPDATE ----
socket.on('state_update',(state)=>{
  updateStars(state.stars);
  document.getElementById('round-num').textContent=state.round;
  updateGuestList(state.guestQueue);
  updateRoomsGrid(state.hotelRooms,state.players);
  updateTasksList(state.tasks);
  updatePlayerListGame(state.players);
  updateVoteEnd(state.voteEnd,state.players);
  // clues
  if(state.clues&&state.clues.length>0){
    clues=state.clues;
    renderClues();
  }
});

function updateStars(n){
  const r=document.getElementById('stars-row');
  if(!r)return;
  r.innerHTML='';
  for(let i=0;i<5;i++) r.innerHTML+=(i<n?'⭐':'☆');
}

function updateGuestList(queue){
  const el=document.getElementById('guest-list');
  if(!el)return;
  document.getElementById('queue-count').textContent=queue.filter(g=>!g.checkedIn).length;
  el.innerHTML='';
  queue.forEach(g=>{
    guestMap[g.id]=g;
    const div=document.createElement('div');
    div.className='guest-card'+(g.voteActive?' voting':'');
    div.innerHTML=buildGuestCard(g);
    el.appendChild(div);
  });
}

function buildGuestCard(g){
  const cardClass={'ปกติ':'card-ok','เจาะรู':'card-hole','ไม่มีบัตร':'card-none'}[g.cardType]||'card-ok';
  const cardIcon={'ปกติ':'🪪','เจาะรู':'🔲','ไม่มีบัตร':'❌'}[g.cardType]||'🪪';
  if(g.checkedIn){
    return `<div class="gc-head"><span class="gc-name">${g.name}</span><span class="checkedin-tag">เช็คอิน ห้อง ${g.assignedRoom}</span></div>`;
  }
  const clueHtml=g.clues.map(c=>`<div class="clue-item">${c}</div>`).join('');
  const voteHtml=g.voteActive?`
    <div class="vote-row">
      <button class="btn-sm btn-accept" onclick="voteGuest('${g.id}','accept')">✅ รับ (${g.votes.accept})</button>
      <button class="btn-sm btn-reject" onclick="voteGuest('${g.id}','reject')">❌ ไล่ (${g.votes.reject})</button>
      <div class="vote-bar-wrap"><div class="vote-bar-fill" style="width:${g.votes.accept+g.votes.reject>0?Math.round(g.votes.accept/(g.votes.accept+g.votes.reject)*100):50}%"></div></div>
    </div>`:'<div style="font-size:.72rem;color:var(--muted);">รอการโหวต...</div>';
  return `
    <div class="gc-head">
      <span class="gc-name">${g.name}</span>
      <span class="gc-card ${cardClass}">${cardIcon} ${g.cardType}</span>
    </div>
    <div class="gc-stats">
      <span>${g.gender}</span><span>อายุ ${g.age} ปี</span>
      <span>สูง ${g.height} ซม.</span><span>หนัก ${g.weight} กก.</span>
    </div>
    <div class="gc-clues">${clueHtml}</div>
    <div class="gc-actions">
      <button class="btn-sm btn-scan" onclick="scanGuest('${g.id}')">🔎 สแกนทันที</button>
    </div>
    ${voteHtml}`;
}

function updateRoomsGrid(hotelRooms,players){
  const el=document.getElementById('rooms-grid');
  if(!el)return;
  el.innerHTML='';
  hotelRooms.forEach(r=>{
    const isMe=players&&players.some(p=>p.id===socket.id&&p.currentRoom===r.id);
    const hasClue=!!r.clueLeft;
    const div=document.createElement('div');
    div.className='room-cell'+(r.occupied?' occupied':'')+(isMe?' my-room':'');
    div.onclick=()=>moveToRoom(r.id);
    div.innerHTML=`
      ${hasClue?'<div class="clue-dot"></div>':''}
      <div class="ricon">${r.occupied?'🛏️':'🚪'}</div>
      <div class="rnum">${r.id}</div>
      <div class="rguest">${r.guestName||'ว่าง'}</div>`;
    el.appendChild(div);
  });
}

function updateTasksList(t){
  const el=document.getElementById('tasks-list');
  if(!el)return;
  el.innerHTML='';
  if(!t||t.length===0){el.innerHTML='<div style="color:var(--muted);font-size:.8rem;">ไม่มีภารกิจ</div>';return;}
  t.forEach(task=>{
    const joined=Object.keys(task.progress||{}).length;
    const needed=task.needPlayers||1;
    const pct=Math.min(100,Math.round(joined/needed*100));
    const div=document.createElement('div');
    div.className='task-card';
    div.innerHTML=`
      <div class="task-head">
        <span class="task-name">${task.name}</span>
        ${task.completed?'<span class="task-done">✅ สำเร็จ</span>':''}
      </div>
      <div class="task-desc">${task.desc}</div>
      ${task.timeBonus>0?`<div style="font-size:.72rem;color:var(--blue)">⏱️ +${task.timeBonus} วิเมื่อสำเร็จ</div>`:''}
      <div class="task-prog">${joined}/${needed} คน</div>
      <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
      ${!task.completed?`<button class="btn-sm btn-accept" onclick="joinTask('${task.id}')">เข้าร่วม</button>`:''}`;
    el.appendChild(div);
  });
}

function updatePlayerListGame(players){
  const el=document.getElementById('player-list-game');
  if(!el)return;
  el.innerHTML='';
  players.forEach(p=>{
    const div=document.createElement('div');
    div.style.cssText='display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--border);font-size:.82rem;';
    div.innerHTML=`<div class="ava" style="background:${avatarColor(p.name)};width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;">${initials(p.name)}</div>
      <span>${p.name}</span>
      <span style="margin-left:auto;color:var(--muted);font-size:.72rem;">${p.currentRoom==='lobby'?'ล็อบบี้':'ห้อง '+p.currentRoom}</span>
      ${p.isAI?'<span class="ai-tag">AI</span>':''}`;
    el.appendChild(div);
  });
}

function updateVoteEnd(voteEnd,players){
  if(!voteEnd||!players)return;
  const humans=players.filter(p=>!p.isAI);
  const votes=Object.keys(voteEnd).length;
  const needed=Math.ceil(humans.length/2);
  const pct=Math.min(100,Math.round(votes/needed*100));
  const fill=document.getElementById('ve-fill');
  const txt=document.getElementById('ve-text');
  if(fill)fill.style.width=pct+'%';
  if(txt)txt.textContent=votes+'/'+needed;
}

function renderClues(){
  const el=document.getElementById('clue-log');
  const empty=document.getElementById('clue-empty');
  if(!el)return;
  el.innerHTML='';
  if(clues.length===0){if(empty)empty.style.display='';return;}
  if(empty)empty.style.display='none';
  clues.forEach(c=>{
    const d=document.createElement('div');
    d.className='clue-entry';
    d.innerHTML=`<span class="ce-src">[${c.source==='task'?'ภารกิจ':c.roomId?'ห้อง '+c.roomId:'ระบบ'}]</span><span>${c.text}</span>`;
    el.appendChild(d);
  });
  el.scrollTop=el.scrollHeight;
}

// ---- ACTIONS ----
function voteGuest(id,vote){
  socket.emit('vote_guest',{guestId:id,vote});
  toast(vote==='accept'?'✅ โหวตรับแขก':'❌ โหวตไล่แขก','info');
}
function scanGuest(id){
  socket.emit('scan_guest',{guestId:id});
}
function joinTask(id){
  socket.emit('join_task',{taskId:id});
}
function moveToRoom(id){
  currentRoom=id;
  socket.emit('move_room',{roomId:id});
}
function voteEnd(){
  if(votedEnd){toast('คุณโหวตไปแล้ว','warn');return;}
  votedEnd=true;
  socket.emit('vote_end_game');
  document.getElementById('btn-vote-end').disabled=true;
  toast('โหวตจบเกมแล้ว','info');
}

// ---- GAME EVENTS ----
socket.on('guest_vote_open',({guest})=>{
  guestMap[guest.id]=guest;
  toast(`🧾 ${guest.name} รอโหวต — บัตร: ${guest.cardType}`,'warn',5000);
  addLog(`${guest.name} รอการโหวต (บัตร: ${guest.cardType})`,'warn');
  socket.emit('state_update'); // re-request via state
});

socket.on('guest_vote_cast',({guestId,vote,voterName,accept,reject})=>{
  if(guestMap[guestId]){
    guestMap[guestId].votes={...guestMap[guestId].votes,accept,reject};
  }
  addLog(`${voterName} โหวต${vote==='accept'?'รับ':'ไล่'} ${guestMap[guestId]?.name||'?'}`,'info');
});

socket.on('guest_rejected',({guestId,guestName,correct,stars})=>{
  toast(correct?`👻 ${guestName} โดนโหวตออก — เป็นผีจริง!`:`😱 ${guestName} เป็นคน! ไล่ออกผิด เสีย 1 ดาว`,correct?'good':'bad',4000);
  addLog(correct?`${guestName} โดนโหวตออก — เป็นผี ✅`:`${guestName} โดนไล่ออกทั้งที่เป็นคน ❌`,correct?'good':'bad');
  if(stars!==undefined)updateStars(stars);
  delete guestMap[guestId];
});

socket.on('guest_checkin',({guestId,guestName,roomId})=>{
  toast(`🏨 ${guestName} เช็คอินห้อง ${roomId}`,'info');
  addLog(`${guestName} เช็คอินห้อง ${roomId}`,'info');
});

socket.on('scan_result',({guestId,guestName,isGhost,scannerName,stars})=>{
  if(isGhost){
    toast(`✅ ${guestName} เป็นผี! ${scannerName} สแกนถูก`,'good');
    addLog(`${scannerName} สแกน ${guestName} → ผี ✅`,'good');
  } else {
    toast(`⚠️ ${guestName} เป็นคน! เสีย 1 ดาว`,'bad');
    addLog(`${scannerName} สแกน ${guestName} → คน ❌ เสีย 1 ดาว`,'bad');
    if(stars!==undefined)updateStars(stars);
  }
  delete guestMap[guestId];
});

socket.on('task_complete',({taskName,timeBonus})=>{
  toast(`✅ ภารกิจ "${taskName}" สำเร็จ!${timeBonus>0?' +'+timeBonus+' วิ':''}`,'good');
  addLog(`ภารกิจ "${taskName}" สำเร็จ${timeBonus>0?' +'+timeBonus+' วิ':''}`,'good');
});

socket.on('task_joined',({taskId,joined,needed,playerName})=>{
  toast(`${playerName} เข้าร่วมภารกิจ (${joined}/${needed})`,'info');
});

socket.on('clue_found',({roomId,text,source})=>{
  clues.push({roomId,text,source:source||'room',round:0});
  renderClues();
  toast(`🔍 เบาะแสใหม่: ${text}`,'warn',5000);
  addLog(`[เบาะแส] ${text}`,'warn');
  document.getElementById('clue-empty').style.display='none';
});

socket.on('moved_to',({roomId})=>{
  toast(`🚶 ย้ายไปห้อง ${roomId}`,'info',1800);
});

socket.on('vote_end_update',({votes,needed})=>{
  updateVoteEnd({length:votes},{length:needed});
  const fill=document.getElementById('ve-fill');
  const txt=document.getElementById('ve-text');
  if(fill)fill.style.width=Math.min(100,Math.round(votes/needed*100))+'%';
  if(txt)txt.textContent=votes+'/'+needed;
  addLog(`โหวตจบเกม: ${votes}/${needed}`,'info');
});

socket.on('hotel_full',({guestName})=>{
  toast(`⚠️ โรงแรมเต็ม ไม่รับ ${guestName}`,'warn');
  addLog(`โรงแรมเต็ม — ${guestName} ไม่ได้เข้าพัก`,'warn');
});

socket.on('log',({text,type})=>{
  addLog(text,type||'');
});

socket.on('player_left',({name})=>{
  toast(`${name} ออกจากเกม`,'warn');
  addLog(`${name} ออกจากเกม`,'warn');
});

// ---- GAME OVER ----
socket.on('game_over',({win,reasonText,stars,revealRooms,players,allGuests})=>{
  show('end-screen');
  const box=document.getElementById('end-box');
  box.className='end-box '+(win?'end-win':'end-lose');
  document.getElementById('end-icon').textContent=win?'🎉':'💀';
  document.getElementById('end-title').textContent=win?'ชนะแล้ว!':'แพ้แล้ว!';
  document.getElementById('end-desc').textContent=reasonText;
  document.getElementById('final-stars').innerHTML='ดาวสุดท้าย: '+'⭐'.repeat(stars)+'☆'.repeat(5-stars);

  // reveal rooms
  const rr=document.getElementById('reveal-rooms');
  rr.innerHTML='<div style="font-size:.72rem;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px;">ห้องพัก</div>';
  revealRooms.forEach(r=>{
    const d=document.createElement('div');
    d.className='rev-room';
    d.innerHTML=`<span>${r.hasGhost?'👻':'🛏️'}</span>
      <span>ห้อง ${r.id}</span>
      <span style="color:var(--muted)">${r.guestName||'ว่าง'}</span>
      <span class="ml-auto ${r.hasGhost?'rev-ghost':'rev-human'}" style="margin-left:auto">${r.hasGhost?'ผีพัก':'ปกติ'}</span>`;
    rr.appendChild(d);
  });

  // reveal players
  const rp=document.getElementById('reveal-players');
  rp.innerHTML='<div style="font-size:.72rem;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px;">พนักงาน</div>';
  players.forEach(p=>{
    const d=document.createElement('div');
    d.className='rev-item';
    d.innerHTML=`<span>${p.role==='ghost'?'👻':'👤'}</span>
      <span>${p.name}</span>
      ${p.isAI?'<span class="ai-tag">AI</span>':''}
      <span class="${p.role==='ghost'?'rev-ghost':'rev-human'}" style="margin-left:auto">${p.role==='ghost'?'ผี':'มนุษย์'}</span>`;
    rp.appendChild(d);
  });

  // reveal guests
  const rg=document.getElementById('reveal-guests');
  rg.innerHTML='<div style="font-size:.72rem;color:var(--muted);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px;">แขก</div>';
  allGuests.forEach(g=>{
    const d=document.createElement('div');
    d.className='rev-item';
    d.innerHTML=`<span>${g.isGhost?'👻':'👤'}</span>
      <span>${g.name}</span>
      <span style="color:var(--muted);font-size:.75rem">${g.cardType}</span>
      <span class="${g.isGhost?'rev-ghost':'rev-human'}" style="margin-left:auto">${g.isGhost?'ผี':'คน'}</span>`;
    rg.appendChild(d);
  });
});

socket.on('error_msg',(msg)=>{ toast('❌ '+msg,'bad'); });
</script>
</body>
</html>
